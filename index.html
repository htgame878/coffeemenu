<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منوی دیجیتال کافه لوتوس (نسخه آزمایشی)</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastinafar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #141414;
            color: #f5f5f5;
            line-height: 1.6;
            padding-bottom: 40px;
        }
        /* بنر هشدار نسخه نمایشی برای کارفرما */
        .prototype-banner {
            background-color: #3b2a00;
            color: #ffcc00;
            text-align: center;
            font-size: 11px;
            padding: 6px;
            border-bottom: 1px solid #5a4000;
            font-weight: bold;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }
        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }
        header h1 {
            color: #d4af37;
            font-size: 22px;
            margin-bottom: 4px;
        }
        header p {
            color: #888;
            font-size: 12px;
        }

        .category {
            margin-bottom: 25px;
            margin-top: 20px;
        }
        .category-title {
            font-size: 16px;
            color: #d4af37;
            margin-bottom: 12px;
            border-right: 3px solid #d4af37;
            padding-right: 8px;
        }

        .menu-item {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border: 1px solid #282828;
        }
        .item-img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            margin-left: 12px;
            flex-shrink: 0;
            background-color: #2a2a2a;
        }
        .item-details {
            flex-grow: 1;
        }
        .item-name {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 2px;
        }
        .item-desc {
            font-size: 11px;
            color: #999;
            line-height: 1.3;
            margin-bottom: 6px;
        }
        /* بخش نیمه کاره: دکمه سفارش غیرفعال */
        .item-action-placeholder {
            display: inline-block;
            background: #2a2a2a;
            color: #777;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px dashed #444;
            cursor: not-allowed;
        }
        .item-price-box {
            text-align: left;
            margin-right: 10px;
        }
        .item-price {
            font-size: 13px;
            color: #d4af37;
            font-weight: bold;
            white-space: nowrap;
            margin-bottom: 5px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 11px;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        .nav-chip {
            background: #222;
            color: #ccc;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }
        .nav-chip:active, .nav-chip:hover {
            background: #d4af37;
            color: #141414;
            border-color: #d4af37;
            font-weight: bold;
        }
        .category-nav {
            position: sticky;
            top: 0;
            background-color: #141414;
            padding: 12px 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            z-index: 1000;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
            scrollbar-width: none; /* مخفی کردن اسکرول‌بار در فایرفاکس */
        }
        .category-nav::-webkit-scrollbar {
            display: none; /* مخفی کردن اسکرول‌بار در کروم و سافاری */
        }
    </style>
</head>
<body>



    <div class="container">
      
        <header>
            <h1>کافه لوتوس</h1>
       
        </header>
<nav class="category-nav container">
        <a href="#hot-drinks" class="nav-chip">نوشیدنی‌های گرم</a>
        <a href="#cold-drinks" class="nav-chip">نوشیدنی‌های سرد</a>
        <a href="#desserts" class="nav-chip">کیک و دسر</a>
        <a href="#fastfood" class="nav-chip">فست‌فود و میان‌وعده</a>
    </nav>

        <div class="category">
            <h2 class="category-title">نوشیدنی‌های گرم</h2>
            
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=200&q=80" alt="اسپرسو" class="item-img">
                <div class="item-details">
                    <div class="item-name">اسپرسو تک / دوبل</div>
                    <div class="item-desc">دانه قهوه عربیکا</div>
                
            
                </div>
                <div class="item-price-box">
                    <div class="item-price">۴۵ ت</div>
                </div>
            </div>

            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=200&q=80" alt="کافه لاته" class="item-img">
                <div class="item-details">
                    <div class="item-name">کافه لاته</div>
                    <div class="item-desc">اسپرسو و شیر بخارداده شده</div>
          
                </div>
                <div class="item-price-box">
                    <div class="item-price">۸۵ ت</div>
                </div>
            </div>
        </div>


        <div class="category">
            <h2 class="category-title">کیک و دسر</h2>
            
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=200&q=80" alt="چیزکیک" class="item-img">
                <div class="item-details">
                    <div class="item-name">چیزکیک نیویورکی</div>
                    <div class="item-desc">کرم پنیری لطیف</div>
               
                </div>
                <div class="item-price-box">
                    <div class="item-price">۱۱۰ ت</div>
                </div>
            </div>
        </div>


    </div>

</body>
</html>
